<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aavula's Finance Tracker</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            color: #000000; 
            overflow-x: hidden;
        }
        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            padding-bottom: 50px;
        }
        h1 { 
            text-align: center; 
            color: #000000; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-size: 24px;
            margin-bottom: 5px;
        }
        .status { 
            text-align: center; 
            font-size: 12px; 
            color: #6b7280; 
            height: 16px; 
            margin-bottom: 30px; 
        }
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            margin-top: 30px;
            font-weight: 700;
        }
        
        /* Individual Pill Styling Matching the Image Exactly */
        .pill { 
            background: #000000; 
            color: #ffffff; 
            border-radius: 50px; 
            padding: 20px 30px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        /* Animation classes */
        .item-row {
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out;
        }
        .item-row.removing {
            opacity: 0;
            transform: scale(0.9) translateX(-20px);
        }

        .pill input { 
            background: transparent; 
            border: none; 
            color: #ffffff; 
            font-size: 18px; 
            font-weight: 600; 
            outline: none; 
        }
        input[type="text"] { width: 50%; }
        input[type="number"] { width: 35%; text-align: right; }
        input::placeholder { color: rgba(255,255,255,0.6); }
        
        .delete-btn { 
            background: transparent; 
            color: #ff4d4d; 
            border: none; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold;
            padding-left: 10px;
            transition: transform 0.2s ease;
        }
        .delete-btn:hover {
            transform: scale(1.2);
        }
        
        .add-btn { 
            background: transparent; 
            color: #000000; 
            border: 2px solid #000000; 
            padding: 12px 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 700;
            margin-top: 5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .add-btn:active { 
            transform: scale(0.98); 
            background: #f0f0f0; 
        }
        
        .balance-amount { font-size: 22px; font-weight: 800; transition: color 0.3s ease; }
        .negative { color: #ff6b6b !important; }
        .positive { color: #4ade80 !important; }
        
        /* Logo Styling */
        .logo-container {
            text-align: center;
            margin-top: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .logo-text {
            font-family: "Times New Roman", Times, serif;
            font-size: 48px;
            letter-spacing: 8px;
            font-weight: 400;
        }
        .logo-icon {
            font-size: 54px;
            line-height: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: #000000;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            text-align: center;
            white-space: nowrap;
        }
        .toast.hide {
            animation: fadeOut 0.3s ease-in forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(30px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes fadeOut {
            from { transform: translateY(0) scale(1); opacity: 1; }
            to { transform: translateY(20px) scale(0.9); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Aavula's Finance Tracker</h1>
    <div class="status" id="save-status">All changes saved locally ✓</div>

    <div class="section-title">Remaining Balance</div>
    <div class="pill">
        <span style="font-size: 18px; font-weight: 600;">Total</span>
        <div class="balance-amount positive" id="total-balance">$0.00</div>
    </div>

    <div class="section-title">Income</div>
    <div id="income-list"></div>
    <button class="add-btn" onclick="addItem('income')">+ Add Income</button>

    <div class="section-title">Loans & Debt</div>
    <div id="debt-list"></div>
    <button class="add-btn" onclick="addItem('debt')">+ Add Loan</button>

    <div class="section-title">Expenses</div>
    <div id="expense-list"></div>
    <button class="add-btn" onclick="addItem('expense')">+ Add Expense</button>

    <div class="logo-container">
        <div class="logo-text">DELO</div>
    </div>

<div id="toast-container"></div>

<script>
    let data = JSON.parse(localStorage.getItem('financeDataTemplate')) || {
        income: [
            { id: 1, name: "Salary", amount: 4000 },
            { id: 2, name: "Side job", amount: 800 }
        ],
        debt: [
            { id: 3, name: "Car loan", amount: 350 },
            { id: 4, name: "Personal loan", amount: 200 }
        ],
        expense: [
            { id: 5, name: "Groceries", amount: 400 }
        ]
    };

    function showToast(message) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = message;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.add('hide');
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    function getToastMessage(action, category) {
        const messages = {
            add_income: ["Nice, you're earning more! 💸", "Making that bread! 🍞", "Get that bag! 💰"],
            remove_income: ["Lost an income stream? 📉", "Ouch, less money coming in. 😟"],
            add_expense: ["Spending more? Watch your budget! 🛒", "Another expense added. 💳"],
            remove_expense: ["Yay, saving money! ✂️", "Expense cut! Great job. 🎉"],
            add_debt: ["Taking on more debt? Be careful! 🏦", "Another loan added. 📉"],
            remove_debt: ["Paying off debt! Awesome! 🎉", "One step closer to debt-free! 🙌"]
        };
        const options = messages[`${action}_${category}`];
        return options[Math.floor(Math.random() * options.length)];
    }

    function saveData(silent = false) {
        localStorage.setItem('financeDataTemplate', JSON.stringify(data));
        if (!silent) {
            const status = document.getElementById('save-status');
            status.innerText = "Saving...";
            status.style.color = "#000000";
            setTimeout(() => {
                status.innerText = "All changes saved locally ✓";
                status.style.color = "#6b7280";
            }, 500);
        }
        updateUI();
    }

    function updateItem(category, id, field, value) {
        const item = data[category].find(i => i.id === id);
        if (item) {
            item[field] = field === 'amount' ? parseFloat(value) || 0 : value;
            saveData(true);
        }
    }

    function deleteItem(category, id, btnElement) {
        showToast(getToastMessage('remove', category));
        const row = btnElement.closest('.item-row');
        row.classList.add('removing');
        
        setTimeout(() => {
            data[category] = data[category].filter(i => i.id !== id);
            saveData();
        }, 300); 
    }

    function addItem(category) {
        const newItem = { id: Date.now(), name: "", amount: 0 };
        data[category].push(newItem);
        showToast(getToastMessage('add', category));
        saveData();
    }

    function renderList(category, listId) {
        const list = document.getElementById(listId);
        list.innerHTML = '';
        
        if (data[category].length === 0) {
            list.innerHTML = '<div style="text-align:center; padding: 10px; opacity: 0.5;">No items added</div>';
            return;
        }

        data[category].forEach(item => {
            const row = document.createElement('div');
            row.className = 'pill item-row';
            row.innerHTML = `
                <input type="text" value="${item.name}" placeholder="Name" onblur="updateItem('${category}', ${item.id}, 'name', this.value)">
                <div style="display: flex; align-items: center; justify-content: flex-end; width: 45%;">
                    <span style="margin-right: 2px;">$</span>
                    <input type="number" value="${item.amount || ''}" placeholder="0" onblur="updateItem('${category}', ${item.id}, 'amount', this.value)">
                    <button class="delete-btn" onclick="deleteItem('${category}', ${item.id}, this)">×</button>
                </div>
            `;
            list.appendChild(row);
        });
    }

    function updateUI() {
        renderList('income', 'income-list');
        renderList('expense', 'expense-list');
        renderList('debt', 'debt-list');

        const totalIncome = data.income.reduce((sum, item) => sum + (item.amount || 0), 0);
        const totalExpense = data.expense.reduce((sum, item) => sum + (item.amount || 0), 0);
        const totalDebt = data.debt.reduce((sum, item) => sum + (item.amount || 0), 0);
        
        const balance = totalIncome - totalExpense - totalDebt;

        const balanceEl = document.getElementById('total-balance');
        balanceEl.innerText = `$${balance.toFixed(2)}`;
        
        if (balance < 0) {
            balanceEl.classList.remove('positive');
            balanceEl.classList.add('negative');
        } else {
            balanceEl.classList.remove('negative');
            balanceEl.classList.add('positive');
        }
    }

    updateUI();
</script>

</body>
</html>
