<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aavula's Finance Tracker</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            color: #000000; 
            overflow-x: hidden;
        }
        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            padding-bottom: 50px;
        }
        h1 { 
            text-align: center; 
            color: #000000; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-size: 24px;
            margin-bottom: 5px;
        }
        .status { 
            text-align: center; 
            font-size: 12px; 
            color: #6b7280; 
            height: 16px; 
            margin-bottom: 30px; 
        }
        
        /* Editable Section Titles */
        .section-title-input {
            background: transparent;
            border: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            margin-top: 30px;
            font-weight: 700;
            color: #000000;
            width: 100%;
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-bottom 0.3s ease;
            padding-bottom: 2px;
        }
        .section-title-input:hover, .section-title-input:focus {
            border-bottom: 1px dashed #ccc;
        }
        .static-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            margin-top: 30px;
            font-weight: 700;
        }
        
        /* Individual Pill Styling */
        .pill { 
            background: #000000; 
            color: #ffffff; 
            border-radius: 50px; 
            padding: 20px 30px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        /* Animation classes */
        .item-row {
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out;
        }
        .item-row.removing {
            opacity: 0;
            transform: scale(0.9) translateX(-20px);
        }

        .pill input { 
            background: transparent; 
            border: none; 
            border-bottom: 1px dashed transparent;
            color: #ffffff; 
            font-size: 18px; 
            font-weight: 600; 
            outline: none; 
            transition: border-bottom 0.3s ease;
            padding-bottom: 2px;
        }
        .pill input:hover, .pill input:focus {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.5);
        }
        
        input[type="text"] { width: 50%; }
        input[type="number"] { width: 35%; text-align: right; }
        input::placeholder { color: rgba(255,255,255,0.6); }
        
        .delete-btn { 
            background: transparent; 
            color: #ff4d4d; 
            border: none; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold;
            padding-left: 10px;
            transition: transform 0.2s ease;
        }
        .delete-btn:hover {
            transform: scale(1.2) rotate(90deg);
        }
        
        .add-btn { 
            background: transparent; 
            color: #000000; 
            border: 2px solid #000000; 
            padding: 12px 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 700;
            margin-top: 5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .add-btn:active { 
            transform: scale(0.98); 
            background: #f0f0f0; 
        }
        
        .balance-amount { font-size: 22px; font-weight: 800; transition: color 0.3s ease; }
        .negative { color: #ff6b6b !important; }
        .positive { color: #4ade80 !important; }
        
        /* Footer Styling */
        .footer-container {
            text-align: center;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo-text {
            font-family: "Times New Roman", Times, serif;
            font-size: 48px;
            letter-spacing: 8px;
            font-weight: 400;
            margin-left: 8px; /* Visual balance for letter spacing */
        }
        .by-text {
            font-size: 13px;
            color: #888888;
            margin-top: 2px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Super Cool Full Screen Overlay */
        #toast-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease-in-out;
            pointer-events: none;
            overflow: hidden;
        }
        #toast-container.show {
            opacity: 1;
            visibility: visible;
        }
        .toast-message {
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 10px 40px rgba(255,255,255,0.4);
            transform: translateY(30px) scale(0.8) rotate(-3deg);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
        }
        #toast-container.show .toast-message {
            transform: translateY(0) scale(1) rotate(0deg);
            opacity: 1;
        }
        
        /* Floating Emoji Particles */
        .emoji-particle {
            position: absolute;
            font-size: 50px;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: explodeUp 1.2s ease-out forwards;
        }
        
        @keyframes explodeUp {
            0% { transform: translateY(50px) scale(0.2) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(-300px) scale(1.5) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Aavula's Finance Tracker</h1>
    <div class="status" id="save-status">All changes saved locally ✓</div>

    <div class="static-title">Remaining Balance</div>
    <div class="pill">
        <span style="font-size: 18px; font-weight: 600;">Total</span>
        <div class="balance-amount positive" id="total-balance">$0.00</div>
    </div>

    <input type="text" class="section-title-input" id="title-income" onblur="updateTitle('income', this.value)">
    <div id="income-list"></div>
    <button class="add-btn" id="btn-income" onclick="addItem('income')">+ Add Income</button>

    <input type="text" class="section-title-input" id="title-debt" onblur="updateTitle('debt', this.value)">
    <div id="debt-list"></div>
    <button class="add-btn" id="btn-debt" onclick="addItem('debt')">+ Add Loan</button>

    <input type="text" class="section-title-input" id="title-expense" onblur="updateTitle('expense', this.value)">
    <div id="expense-list"></div>
    <button class="add-btn" id="btn-expense" onclick="addItem('expense')">+ Add Expense</button>

    <div class="footer-container">
        <div class="logo-text">DELO</div>
        <div class="by-text">by Moulik</div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    let data = JSON.parse(localStorage.getItem('financeDataTemplate')) || {
        titles: {
            income: "Income",
            debt: "Loans & Debt",
            expense: "Expenses"
        },
        income: [
            { id: 1, name: "Salary", amount: 4000 },
            { id: 2, name: "Side job", amount: 800 }
        ],
        debt: [
            { id: 3, name: "Car loan", amount: 350 },
            { id: 4, name: "Personal loan", amount: 200 }
        ],
        expense: [
            { id: 5, name: "Groceries", amount: 400 }
        ]
    };

    if (!data.titles) {
        data.titles = {
            income: "Income",
            debt: "Loans & Debt",
            expense: "Expenses"
        };
    }

    let toastTimeout;

    function showToast(message) {
        const container = document.getElementById('toast-container');
        
        const emojiMatch = message.match(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu);
        const emoji = emojiMatch ? emojiMatch[0] : '✨';
        
        let content = `<div class="toast-message">${message}</div>`;
        
        for(let i=0; i<12; i++) {
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            const delay = Math.random() * 0.1;
            const size = Math.random() * 20 + 30; 
            content += `<div class="emoji-particle" style="left: ${left}%; top: ${top}%; animation-delay: ${delay}s; font-size: ${size}px;">${emoji}</div>`;
        }
        
        container.innerHTML = content;
        
        setTimeout(() => {
            container.classList.add('show');
        }, 10);
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            container.classList.remove('show');
        }, 1000); // Changed to 1 second
    }

    function getToastMessage(action, category) {
        const messages = {
            add_income: ["Making that bread! 🍞", "Get that bag! 💰", "Money moves! 💸"],
            remove_income: ["Lost an income stream? 📉", "Less money coming in 😟"],
            add_expense: ["Watch your budget! 🛒", "Another expense added 💳", "Swiping that card! 🛍️"],
            remove_expense: ["Saving money! ✂️", "Expense cut! 🎉", "More cash in pocket! 🤑"],
            add_debt: ["Taking on debt! 🏦", "Another loan added 📉"],
            remove_debt: ["Paying off debt! 🎉", "Step to debt-free! 🙌", "Crushing it! 💪"]
        };
        const options = messages[`${action}_${category}`];
        return options[Math.floor(Math.random() * options.length)];
    }

    function saveData(silent = false) {
        localStorage.setItem('financeDataTemplate', JSON.stringify(data));
        if (!silent) {
            const status = document.getElementById('save-status');
            status.innerText = "Saving...";
            status.style.color = "#000000";
            setTimeout(() => {
                status.innerText = "All changes saved locally ✓";
                status.style.color = "#6b7280";
            }, 500);
        }
        updateUI();
    }

    function updateTitle(category, value) {
        data.titles[category] = value;
        saveData(true);
        updateButtons();
    }

    function updateItem(category, id, field, value) {
        const item = data[category].find(i => i.id === id);
        if (item) {
            item[field] = field === 'amount' ? parseFloat(value) || 0 : value;
            saveData(true);
        }
    }

    function deleteItem(category, id, btnElement) {
        showToast(getToastMessage('remove', category));
        const row = btnElement.closest('.item-row');
        row.classList.add('removing');
        
        setTimeout(() => {
            data[category] = data[category].filter(i => i.id !== id);
            saveData();
        }, 300); 
    }

    function addItem(category) {
        const newItem = { id: Date.now(), name: "", amount: 0 };
        data[category].push(newItem);
        showToast(getToastMessage('add', category));
        saveData();
    }

    function renderList(category, listId) {
        const list = document.getElementById(listId);
        list.innerHTML = '';
        
        if (data[category].length === 0) {
            list.innerHTML = '<div style="text-align:center; padding: 10px; opacity: 0.5;">No items added</div>';
            return;
        }

        data[category].forEach(item => {
            const row = document.createElement('div');
            row.className = 'pill item-row';
            row.innerHTML = `
                <input type="text" value="${item.name}" placeholder="Name" onblur="updateItem('${category}', ${item.id}, 'name', this.value)">
                <div style="display: flex; align-items: center; justify-content: flex-end; width: 45%;">
                    <span style="margin-right: 2px;">$</span>
                    <input type="number" value="${item.amount || ''}" placeholder="0" onblur="updateItem('${category}', ${item.id}, 'amount', this.value)">
                    <button class="delete-btn" onclick="deleteItem('${category}', ${item.id}, this)">×</button>
                </div>
            `;
            list.appendChild(row);
        });
    }

    function updateButtons() {
        const getShortName = (title, defaultName) => {
            if (!title) return defaultName;
            const words = title.trim().split(' ');
            return words.length > 0 ? words[words.length - 1] : defaultName;
        };
        
        document.getElementById('btn-income').innerText = `+ Add ${getShortName(data.titles.income, 'Income')}`;
        document.getElementById('btn-debt').innerText = `+ Add ${getShortName(data.titles.debt, 'Loan')}`;
        document.getElementById('btn-expense').innerText = `+ Add ${getShortName(data.titles.expense, 'Expense')}`;
    }

    function updateUI() {
        document.getElementById('title-income').value = data.titles.income;
        document.getElementById('title-debt').value = data.titles.debt;
        document.getElementById('title-expense').value = data.titles.expense;
        
        updateButtons();

        renderList('income', 'income-list');
        renderList('expense', 'expense-list');
        renderList('debt', 'debt-list');

        const totalIncome = data.income.reduce((sum, item) => sum + (item.amount || 0), 0);
        const totalExpense = data.expense.reduce((sum, item) => sum + (item.amount || 0), 0);
        const totalDebt = data.debt.reduce((sum, item) => sum + (item.amount || 0), 0);
        
        const balance = totalIncome - totalExpense - totalDebt;

        const balanceEl = document.getElementById('total-balance');
        balanceEl.innerText = `$${balance.toFixed(2)}`;
        
        if (balance < 0) {
            balanceEl.classList.remove('positive');
            balanceEl.classList.add('negative');
        } else {
            balanceEl.classList.remove('negative');
            balanceEl.classList.add('positive');
        }
    }

    updateUI();
</script>

</body>
</html>
